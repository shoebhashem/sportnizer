name: CI — Lint & Type Check

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    branches: [main, development]
    paths-ignore:
      - "*.md"
      - "docs/**"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
