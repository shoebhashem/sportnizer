name: Deploy Web to Netlify

on:
  # Auto-deploy when pushing to main (only app code, not functions-only changes)
  push:
    branches: [main]
    paths-ignore:
      - "functions/**"
      - "*.md"
      - "docs/**"
      - ".github/workflows/functions-tests.yml"

  # Manual trigger with platform selector (for future Android/iOS expansion)
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to build and deploy"
        required: true
        default: "web"
        type: choice
        options:
          - web
          # - android  # Future: uncomment when EAS is set up
          # - ios      # Future: uncomment when EAS is set up
          # - all      # Future: uncomment when EAS is set up

jobs:
  deploy-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    # Run if: auto-push (no inputs) OR manually selected web/all
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'web' ||
      github.event.inputs.platform == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}

      - name: Ensure Netlify deploys font files
        run: |
          # Netlify skips node_modules by default, but Expo outputs icon fonts
          # to dist/assets/node_modules/@expo/vector-icons/...
          # An empty .netlifyignore overrides the default ignore list
          touch dist/.netlifyignore

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: "./dist"
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

