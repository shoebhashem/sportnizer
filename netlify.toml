[build]
  command = "npx expo export --platform web"
  publish = "dist"

# Serve Apple App Site Association and Android Asset Links with correct Content-Type.
# iOS requires Content-Type: application/json or it silently ignores the file.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Serve static assets directly (fonts, images, JS, CSS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA redirect: send all routes to index.html for client-side routing
# force = false ensures existing files are served before falling back
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
