[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_FIREBASE_API_KEY,EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,EXPO_PUBLIC_FIREBASE_PROJECT_ID,EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET,EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,EXPO_PUBLIC_FIREBASE_APP_ID,EXPO_PUBLIC_FIREBASE_APP_ID_ANDROID,EXPO_PUBLIC_FIREBASE_APP_ID_IOS,EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID,EXPO_PUBLIC_FIREBASE_FUNCTIONS_URL,BASE_URL"

# Serve Apple App Site Association and Android Asset Links with correct Content-Type.
# iOS requires Content-Type: application/json or it silently ignores the file.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Serve static assets directly (fonts, images, JS, CSS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA redirect: send all routes to index.html for client-side routing
# force = false ensures existing files are served before falling back
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
